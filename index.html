te", "body": "Run the cell, inspect the candidate drawings/charges and choose a microstate. Enter a reason and click Confirm microstate & prepare ligand. The accessible hosted text showed microstate #0, charge 0, followed by a GAFF2/AM1-BCC ready receipt (203.78 s parameterization). The screenshot output region failed to render, so this receipt is retained as UI text evidence, not a replacement image. The button was not clicked by the assistant; full human-decision provenance is unverified. Heuristic pKa scores are not experimental data.", "shots": [], "diagram": null}, {"id": "supplied", "cell": "Step 5 · optional", "title": "Reuse PREP + FRCMOD safely", "body": "For an existing organic ligand bundle choose Existing AMBER PREP + FRCMOD, its original GAFF/GAFF2 base and parameter provenance. Upload exactly one PREP/PREPI/PREPIN and one FRCMOD together; leave both paths blank to open the dialog. Supply matching ligand identity and confirm pKaNET state. PDB is for coordinates/viewing; validated MOL2/FRCMOD supplies parameters. This route was not exercised in the captured run. CHARMM, metal or covalent ligand templates need a separate supported model.", "shots": ["25_prep_options_clean"], "diagram": null}, {"id": "bcsp", "cell": "Step 6", "title": "Place beyond the exterior surface", "body": "BCSP extends the site-center/protein-COM line in both directions, finds outermost intersections of vdW spheres + 1.4 Å probe, and chooses the shorter valid outward candidate. The 25 Å default is from the selected surface point to ligand COM, not from the pocket. The hosted receipt reports minimum heavy-atom separation 20.0 Å, clash-free and solvent-exposed. This line is not a validated entry pathway. Unlike Bertazzo et al. (2018), BCSP itself adds no pocket-axis cylindrical confinement.", "shots": ["34_bcsp_clean"], "diagram": "bcsp"}, {"id": "manual", "cell": "Optional 6b", "title": "Adjust atoms, not the camera", "body": "Choose Manual or Auto + Adjust, then use COM fields, translation sliders, rotation controls, arrows and step size. Reset pose restores the reference pose. Click Confirm Placement only after checking clashes. Dragging the 3D view rotates the camera and does not change molecular coordinates. The captured widget remained Auto BCSP with zero adjustments; no coordinate-manipulation test or confirmation was performed by the assistant.", "shots": ["14_manual_controls"], "diagram": null}, {"id": "solvate", "cell": "Step 7", "title": "Select solvent, ions and box", "body": "Choose ff19SB/ff14SB, supported OPC/TIP3P/TIP4P-Ew/SPC/E water, bulk ion mode and cubic/rectangular/octahedral box. In this run: ff19SB + GAFF2, OPC, neutralization only and cubic box. RNA/lipid pathways and original TIP4P/TIP5P/SPC are not enabled by their presence in a dropdown. The Show water checkbox changes display only; it does not delete solvent. Orange lines show lattice vectors, not a universal absolute origin. The checkbox was not toggled by the assistant.", "shots": ["27_solvation_form_clean", "28_periodic_box_clean", "29_solvation_receipt_preview"], "diagram": null}, {"id": "minimize", "cell": "Step 8", "title": "Require convergence, not just lower energy", "body": "Run restrained then unrestrained minimization. The captured settings are 5,000 iterations per stage, restraint k 1,000 kJ mol⁻¹ nm⁻², acceptance gradient RMS 10 and optimizer tolerance 5 kJ mol⁻¹ nm⁻¹. Do not relax acceptance to force PASS. The cell showed execution, but its final output frame was inaccessible. Final energies, gradient RMS, stopping reason and independent final restart reload remain UNVERIFIED. A completed execution count is not a convergence certificate.", "shots": ["35_minimization_form_clean"], "diagram": null}, {"id": "export", "cell": "Step 9", "title": "Export and collect the evidence", "body": "After successful validation, choose PaCS-Q/OpenMM/AMBER/GROMACS targets and download the ZIP. Keep complex.prmtop, complex_min.rst7, reports, logs and CITATIONS files toget ructed"], "diagram": null}, {"id": "protein-chemistry", "cell": "Step 4", "title": "プロトン化とジスルフィドを確認", "body": "成分選択後に PDB2PQR/PROPKA を実行します。pKa、部位警告、ヒスチジン互変異性体、システイン状態を確認します。表示値は滴定可能 36 残基、候補ジスルフィド 0、HIS77 は HID、補完重原子 3 です。今回は自動推奨でした。予測は実験的割当ではなく、PQR 電荷・半径を ff19SB に転用しません。0 対の例は CYX/SG–SG 結合の実証ではありません。", "shots": ["23_protonation_unobstructed"], "diagram": null}, {"id": "ligand", "cell": "Step 5", "title": "外部リガンドを指定", "body": "Step 5 で SMILES、PubChem 名/CID、SDF/MOL/MOL2 を選びます。3MXF では意図した JQ1 立体異性体を確認し、名称だけに頼らないでください。今回は SMILES 入力で PubChem 名検索は未実行です。リガンド pH 7.4 はタンパク質 pH と別です。画面の式は C23H25ClN4O2S、形式電荷 0 ですが CCD/異性体の独立照合には出力監査が必要です。", "shots": ["24_ligand_form_clean"], "diagram": null}, {"id": "microstate", "cell": "Step 5 · review", "title": "pKaNET 微視状態を確認", "body": "セル実行後、候補構造と電荷を調べ、理由を記入して Confirm microstate & prepare ligand を押します。取得できた画面テキストは #0、電荷 0、GAFF2/AM1-BCC 完了（203.78 秒）を示しました。画像表示が失敗したためテキスト証拠として保存し、代用画像は作りません。アシスタントは承認ボタンを押しておらず、人間の意思決定来歴は未監査です。経験的 pKa は実験値ではありません。", "shots": [], "diagram": null}, {"id": "supplied", "cell": "Step 5 · optional", "title": "PREP + FRCMOD を再利用", "body": "既存有機リガンドでは Existing AMBER PREP + FRCMOD、元の GAFF/GAFF2 と来歴を指定します。PREP/PREPI/PREPIN 1 個と FRCMOD 1 個を同時にアップロードします。両パスを空欄にすると選択画面が開きます。対応する化学同一性と pKaNET 状態を確認してください。PDB は表示用、検証済み MOL2/FRCMOD がパラメータ源です。この経路は今回未実行です。CHARMM、金属、共有結合リガンドは別モデルが必要です。", "shots": ["25_prep_options_clean"], "diagram": null}, {"id": "bcsp", "cell": "Step 6", "title": "外表面の外へ配置", "body": "BCSP は部位中心とタンパク質 COM の直線を双方向へ延ばし、vdW 球 + 1.4 Å プローブの最外交点から短い有効候補を選びます。25 Å は表面点からリガンド COM までで、ポケットからではありません。画面では最短重原子距離 20.0 Å、衝突なし、溶媒露出です。経路の実証ではなく、Bertazzo ら（2018）のポケット軸円筒拘束も付与しません。", "shots": ["34_bcsp_clean"], "diagram": "bcsp"}, {"id": "manual", "cell": "Optional 6b", "title": "カメラではなく原子を動かす", "body": "Manual / Auto + Adjust を選び、COM、並進、回転、矢印、刻み幅を使います。Reset pose は参照姿勢へ戻します。衝突確認後に Confirm Placement を押してください。3D 画面のドラッグはカメラ操作で分子座標を変えません。今回の画面は Auto BCSP、調整 0 で、アシスタントは座標変更や確認を実行していません。", "shots": ["14_manual_controls"], "diagram": null}, {"id": "solvate", "cell": "Step 7", "title": "溶媒・イオン・ボックスを選ぶ", "body": "ff19SB/ff14SB、対応 OPC/TIP3P/TIP4P-Ew/SPC/E、水・バルクイオン・ボックスを選びます。今回は ff19SB + GAFF2、OPC、中和のみ、立方体です。RNA/脂質、元の TIP4P/TIP5P/SPC は選択欄にあっても有効ではありません。Show water は表示だけで水を削除しません。橙線は格子ベクトルで絶対原点ではありません。アシスタントは切替を行っていません。", "shots": ["27_solvation_form_clean", "28_periodic_box_clean", "29_solvation_receipt_preview"], "diagram": null}, {"id": "minimize", "cell": "Step 8", "title": "エネルギー低下だけでなく収束を確認", "body": "拘束付き・拘束なし最小化を実行します。設定は各 5,000 反復、拘束 k=1,000 kJ mol⁻¹ nm⁻²、勾配 RMS 基準 10、最適化許容値 5 kJ mol⁻¹ nm⁻¹ です。PASS のため基準を緩めないでください。セルの実行は見えましたが最終出力フレームは参照不能でした。最終エネルギー、勾配、停止理由、最終再読込は未検証で、実行番号は収束証明ではありません。", "shots": ["35_minimization_form_clean"], "diagram": null}, {"id": "export", "cell": "Step 9", "title": "出力と証拠を保存", "body": "検証成功後、PaCS-Q/OpenMM/AMBER/GROMACS を選んで ZIP を保存します。complex.prmtop、complex_min.rst7、レポート、ログ、CITATIONS を一緒に保管してください。後で出力セルの実行番号が見えましたが ZIP と出力は取得できず、パッケージと最終再読込は未検証です。実行済みノートブックも別途保存してください。PaCS-Q の実物で bash run.sh --check を実行できますが、今回実行していません。", "shots": ["31_export_options"], "diagram": null}, {"id": "limits", "cell": "Troubleshooting", "title": "安全な保存と未対応化学系", "body": "ライブ実行にリモート編集保存競合と JavaScript 出力エラーがありました。撮影のため実行中に再読込やブラウザー保護緩和をしないでください。安全な時に通常の保存・ダウンロードで実行済みファイルを保管します。未対応金属・補因子には明示的モデルが必要で、IC6 は全ヘム状態への対応ではありません。今回ヘム、Zn、PREP 経路のホスト試験は未撮影です。検証済みリリースの GO ではありません。", "shots": ["12_colab_output_blocker"], "diagram": null}], "title": "一つずつ確認しながら、タンパク質–リガンド系を準備する。", "subtitle": "3MXF–JQ1 の実際の Colab 画面を使った DFDD Input Generator の操作ガイド。", "warning": "ホスト実行の一部を確認しましたが、リリース認証ではありません。最終最小化指標・最終ファイルの独立再読込・ZIP は未検証です。Colab に保存競合と出力表示エラーがありました。", "scope": "入力作成は Step 9 で終了します。Step 10 は動力学計算を開始するため、入力作成のみなら Run all を使わないでください。", "contents": "目次", "search": "手順を検索…", "open": "ノートブックを開く", "print": "印刷 / PDF 保存", "screenshot": "実際の Colab 画面 · クリックで拡大", "diagram": "ユーザー提供の模式図 · 実行画面ではありません", "evidence": "証拠と制限", "close": "画像を閉じる", "observed": "ホスト画面で確認した記録", "facts": "127 観測 / 127 登録残基。LYS141 の CD/C 立體異構體，不可僅依賴名稱。本次使用 SMILES，未執行 PubChem 名稱搜尋。配體 pH 7.4 與蛋白質 pH 獨立。介面給出 C23H25ClN4O2S、形式電荷 0；獨立 CCD/立體異構體比對仍需審查檔案。", "shots": ["24_ligand_form_clean"], "diagram": null}, {"id": "microstate", "cell": "Step 5 · review", "title": "確認 pKaNET 微觀狀態", "body": "執行後檢查候選結構及電荷，填寫理由並點擊 Confirm microstate & prepare ligand。可讀取的介面文字顯示 #0、電荷 0，接著為 GAFF2/AM1-BCC 完成紀錄（203.78 秒）。截圖輸出區顯示失敗，因此保留文字證據，不製作替代影像。助手未點擊確認按鈕；完整人工決策來源尚未稽核。啟發式 pKa 評分不是實驗資料。", "shots": [], "diagram": null}, {"id": "supplied", "cell": "Step 5 · optional", "title": "安全重用 PREP + FRCMOD", "body": "已有有機配體參數時，選擇 Existing AMBER PREP + FRCMOD、原始 GAFF/GAFF2 基礎及參數來源。同時上傳一個 PREP/PREPI/PREPIN 與一個 FRCMOD；路徑均留空可開啟上傳視窗。輸入相符的化學身分並確認 pKaNET 狀態。PDB 用於座標/顯示，參數來自驗證過的 MOL2/FRCMOD。本次未執行此路線。CHARMM、金屬或共價配體模板需要獨立支援模型。", "shots": ["25_prep_options_clean"], "diagram": null}, {"id": "bcsp", "cell": "Step 6", "title": "放置於外表面之外", "body": "BCSP 將位點中心–蛋白質 COM 直線向雙向延伸，尋找 vdW 球加 1.4 Å 探針包絡的最外交點，並選較短的有效外向候選。25 Å 從所選表面點量至配體 COM，不是從口袋量起。介面回報最近重原子距離 20.0 Å、無碰撞且暴露於溶劑。此直線不是已驗證入口路徑；BCSP 本身不施加 Bertazzo 等（2018）的口袋軸圓柱約束。", "shots": ["34_bcsp_clean"], "diagram": "bcsp"}, {"id": "manual", "cell": "Optional 6b", "title": "調整原子而非相機", "body": "選擇 Manual 或 Auto + Adjust，再用 COM、平移滑桿、旋轉、箭頭及步長調整。Reset pose 恢復參考姿態。檢查碰撞後才點擊 Confirm Placement。拖曳 3D 視圖僅旋轉相機，不改變分子座標。截圖元件維持 Auto BCSP、調整值為零；助手未進行座標操作或確認測試。", "shots": ["14_manual_controls"], "diagram": null}, {"id": "solvate", "cell": "Step 7", "title": "選擇水、離子與盒型", "body": "選擇 ff19SB/ff14SB、支援的 OPC/TIP3P/TIP4P-Ew/SPC/E、體相離子模式及立方/長方/截角八面體盒。本次使用 ff19SB + GAFF2、OPC、僅中和與立方盒。下拉選單中的 RNA/脂質或原始 TIP4P/TIP5P/SPC 不代表已支援。Show water 僅改變顯示，不刪除水。橙線表示晶格向量，不代表固定絕對原點。助手未切換此核取方塊。", "shots": ["27_solvation_form_clean", "28_periodic_box_clean", "29_solvation_receipt_preview"], "diagram": null}, {"id": "minimize", "cell": "Step 8", "title": "要求收斂，而非僅能量降低", "body": "先執行有約束再無約束最小化。截圖設定為每階段 5,000 次、約束 k=1,000 kJ mol⁻¹ nm⁻²、接受梯度 RMS 10、最佳化器容許值 5 kJ mol⁻¹ nm⁻¹。不要放寬接受標準以強行通過。雖有執行紀錄，但最終輸出框無法讀取。最終能量、梯度、停止原因及最終 restart 獨立重載均未驗證；執行計數不是收斂證明。", "shots": ["35_minimization_form_clean"], "diagram": null}, {"id": "export", "cell": "Step 9", "title": "匯出並收集證據", "body": "驗證通過後選擇 PaCS-Q/OpenMM/AMBER/GROMACS 並下載 ZIP。共同保留 complex.prmtop、complex_min.rst7、報告、日誌及 CITATIONS。稍後匯出儲存格顯示執行計數，但本次無法取得輸出或 ZIP，因此封裝與最終檔案重載未驗證。另存執行後的筆記本。實際 PaCS-Q 套件可在其目錄執行 bash run.sh --check 而不啟動生產模擬；本次擷取未執行此檢查。", "shots": ["31_export_options"], "diagram": null}, {"id": "limits", "cell": "Troubleshooting", "title": "安全儲存並尊重未支援的化學系統", "body": "即時工作階段出現遠端編輯儲存衝突及 JavaScript 輸出載入錯誤。不要為截圖重新載入執行中的工作或削弱瀏覽器安全保護。安全時透過 Colab 正常儲存/下載保留執行筆記本及結果。未支援的輔因子/金屬必須明確建模；IC6 是特定模型，並不支援所有血基質狀態。本次沒有血基質、Zn 或 PREP 路線託管測試截圖。目前僅有部分託管證據，不是已驗證發布的 GO。", "shots": ["12_colab_output_blocker"], "diagram": null}], "title": "逐步審查，準備蛋白質–配體系統。", "subtitle": "DFDD Input Generator 實用指南，包含 3MXF–JQ1 在託管 Colab 中的真實截圖。", "warning": "僅有部分託管執行證據，並非發布認證。最終最小化指標、最終檔案獨立重載及匯出 ZIP 均未驗證。Colab 出現自動儲存衝突和輸出顯示錯誤。", "scope": "輸入準備在 Step 9 結束。Step 10 會啟動動力學；僅準備輸入時請勿使用 Run all。", "contents": "目錄", "search": "搜尋步驟…", "open": "開啟筆記本", "print": "列印 / 儲存 PDF", "screenshot": "真實託管 Colab 截圖 · 點擊放大", "diagram": "使用者提供的示意圖 · 不是執行截圖", "evidence": "證據與限制", "close": "關閉圖片", "observed": "已觀察到的託管紀錄", "facts": "觀察到 127 / 宣告的 127 個殘基；LYS141 缺少的 CD/CE/NZ 經建模補全。pH 7.4。JQ1 輸入分子式 C23H25ClN4O2S，形式電荷 0。BCSP 偏移 25 Å，回報的最近重原子距離 20.0 Å。溶劑化紀錄：134,610 個原子、33,108 個 OPC 水分子、約 105.4 Å 立方盒、淨電荷 0.000。這些是介面紀錄，並非獨立拓撲稽核。", "nav": ["介紹", "蛋白質", "配體", "放置", "溶劑化", "驗證與匯出"], "prevnext": ["← 上一步", "下一步 →", "指南目錄", "來源與擷取說明"]}, "ko": {"sections": [{"id": "overview", "cell": "Overview", "title": "범위 이해", "body": "시스템 검사·준비, 외부 리간드 배치, 용매화, 최소화 및 내보내기를 수행합니다. 예제는 BRD4–JQ1(3MXF)입니다. 입력 수정 전 Drive 사본을 저장하세요. 호스팅 제목은 version 1.0.0, 25 Oct 2026이며 로컬 소스와의 일치는 확인되지 않았습니다.", "shots": ["32_overview_clean"], "diagram": "workflow"}, {"id": "setup", "cell": "Setup A / B", "title": "설치 및 런타임 재시작", "body": "적절한 Colab 런타임을 선택하세요. GPU는 OpenMM을 가속할 수 있습니다. Setup A와 안내된 커널 재시작 후 Setup B에서 AmberTools, OpenMM, RDKit, PDB2PQR/PROPKA 및 위젯을 확인합니다. Setup complete 이후 진행하세요. 이번 기록은 기존 의존성을 사용했으며 모든 Colab Python 버전의 신규 설치 검증은 아닙니다.", "shots": ["33_setup_complete_clean"], "diagram": null}, {"id": "inputs", "cell": "Step 1", "title": "3MXF, 사슬 A 및 부위 기준 설정", "body": "Download from RCSB, 3MXF, 사슬 A를 설정합니다. Co-crystal ligand / JQ1은 포켓의 기준이며 최종 외부 리간드가 아닙니다. 잔기 또는 XYZ로도 부위를 정의할 수 있습니다. 기본 단백질 pH는 7.4, 외부 오프셋은 25 Å입니다. 개별 검토에는 Review interactively를 선택하세요. 캡처된 실행은 Accept recommendations를 사용했습니다.", "shots": ["04_protein_settings"], "diagram": null}, {"id": "inspect", "cell": "Step 2", "title": "제출 구조 검사", "body": "Load & inspect protein을 실행하고 3D 구조와 경고를 확인하세요. 호스팅 기록은 127/127개 잔기를 보여주지만 부위 근처 LYS141의 CD/CE/NZ가 없습니다. 이후 모델링된 세 원자는 실험 좌표가 아닙니다. 원본과 복원 부위를 검토하세요. 업로드 구조의 누락 잔기는 자동 복원하지 않으며 불명확한 구성체를 단순히 통과시키지 마세요.", "shots": ["21_inspection_unobstructed"], "diagram": null}, {"id": "components", "cell": "Step 3", "title": "화학적 근거로 성분 선택", "body": "단백질 양성자화 전에 모든 성분을 검토하세요. 이번 자동 권고 실행은 단백질 잔기 127개를 유지하고 JQ1, IOD, DMS, EDO와 물 208개 등 총 214개 성분을 제거했으며 원본은 보존했습니다. 자동 권고 기록이지 개별 인간 승인 증거가 아닙니다. 구조적 물과 기능성 보조인자를 제거하기 전에 평가하세요.", "shots": ["22_components_unobstructed"], "diagram": null}, {"id": "protein-chemistry", "cell": "Step 4", "title": "양성자화 및 이황화 결합 검토", "body": "성분 선택 후 PDB2PQR/PROPKA를 실행하세요. pKa, 부위 경고, 히스티딘 호변이성질체와 시스테인 상태를 검토합니다. UI에는 적정 가능 잔기 36개, 제안 이황화 결합 0개, HIS77의 HID 상태, 복원 중원자 3개가 표시됩니다. 이번 단백질 결정은 자동 권고입니다. 예측은 실험 배정이 아니며 PQR 전하·반경은 ff19SB로 옮기지 않습니다. 결합 0개인 예제는 CYX/SG–SG 검증이 아닙니다.", "shots": ["23_protonation_unobstructed"], "diagram": null}, {"id": "ligand", "cell": "Step 5", "title": "외부 리간드 정의", "body": "Step 5에서 SMILES, PubChem 이름/CID 또는 SDF/MOL/MOL2 업로드를 선택합니다. 3MXF는 원하는 JQ1 입체이성질체인지 확인하세요. 이번 실행은 SMILES를 사용했으며 PubChem 이름 검색은 수행하지 않았습니다. 리간드 pH 7.4는 단백질 pH와 독립적입니다. UI는 C23H25ClN4O2S와 형식 전하 0을 보고하지만 CCD·입체이성질체 독립 비교에는 파일 검토가 필요합니다.", "shots": ["24_ligand_form_clean"], "diagram": null}, {"id": "microstate", "cell": "Step 5 · review", "title": "pKaNET 미시상태 확인", "body": "실행 후 후보 구조와 전하를 검토하고 사유를 입력한 뒤 Confirm microstate & prepare ligand를 누릅니다. 접근 가능한 UI 텍스트에는 #0, 전하 0과 GAFF2/AM1-BCC 완료 기록(203.78초)이 있었습니다. 출력 이미지 표시가 실패하여 텍스트 증거를 보존했으며 대체 이미지를 만들지 않았습니다. 보조자는 확인 버튼을 누르지 않았고 인간 결정의 전체 출처는 미검증입니다. 휴리스틱 pKa는 실험값이 아닙니다.", "shots": [], "diagram": null}, {"id": "supplied", "cell": "Step 5 · optional", "title": "PREP + FRCMOD 재사용", "body": "기존 유기 리간드 매개변수는 Existing AMBER PREP + FRCMOD, 원래 GAFF/GAFF2 기반 및 출처를 지정합니다. PREP/PREPI/PREPIN 한 개와 FRCMOD 한 개를 함께 업로드하세요. 두 경로를 비우면 업로드 창이 열립니다. 일치하는 화학적 정체성과 pKaNET 상태가 필요합니다. PDB는 좌표·표시용이고 검증된 MOL2/FRCMOD가 매개변수 소스입니다. 이번 캡처에서는 이 경로를 실행하지 않았습니다. CHARMM, 금속 및 공유결합 리간드는 별도 모델이 필요합니다.", "shots": ["25_prep_options_clean"], "diagram": null}, {"id": "bcsp", "cell": "Step 6", "title": "외부 표면 바깥에 배치", "body": "BCSP는 부위 중심–단백질 COM 직선을 양방향으로 연장하고 vdW 구 + 1.4 Å 탐침 외피의 최외곽 교점을 찾아 더 짧은 유효 후보를 선택합니다. 25 Å는 선택된 표면점부터 리간드 COM까지이며 포켓 기준이 아닙니다. UI는 최근접 중원자 거리 20.0 Å, 충돌 없음, 용매 노출을 보고합니다. 검증된 진입 경로가 아니며 Bertazzo 등(2018)의 포켓 축 원통 구속을 추가하지 않습니다.", "shots": ["34_bcsp_clean"], "diagram": "bcsp"}, {"id": "manual", "cell": "Optional 6b", "title": "카메라가 아닌 원자 조정", "body": "Manual 또는 Auto + Adjust를 선택하고 COM, 이동 슬라이더, 회전, 화살표 및 간격을 사용하세요. Reset pose는 기준 자세를 복원합니다. 충돌 확인 후 Confirm Placement를 누르세요. 3D 드래그는 카메라만 돌리며 분자 좌표를 바꾸지 않습니다. 캡처 위젯은 Auto BCSP와 조정값 0이며 보조자는 좌표 조작이나 확인 테스트를 수행하지 않았습니다.", "shots": ["14_manual_controls"], "diagram": null}, {"id": "solvate", "cell": "Step 7", "title": "물·이온·상자 선택", "body": "ff19SB/ff14SB, 지원되는 OPC/TIP3P/TIP4P-Ew/SPC/E, 벌크 이온 모드 및 정육면체·직육면체·잘린 팔면체 상자를 선택합니다. 이번 실행은 ff19SB + GAFF2, OPC, 중화만, 정육면체입니다. 드롭다운에 있어도 RNA/지질과 원래 TIP4P/TIP5P/SPC는 미지원입니다. Show water는 표시만 바꾸고 물을 삭제하지 않습니다. 주황선은 격자 벡터이며 고정 절대 원점이 아닙니다. 보조자는 체크박스를 전환하지 않았습니다.", "shots": ["27_solvation_form_clean", "28_periodic_box_clean", "29_solvation_receipt_preview"], "diagram": null}, {"id": "minimize", "cell": "Step 8", "title": "에너지 감소가 아닌 수렴 확인", "body": "구속 후 비구속 최소화를 실행합니다. 캡처 설정은 단계별 5,000회, 구속 k=1,000 kJ mol⁻¹ nm⁻², 허용 gradient RMS 10, 최적화 허용오차 5 kJ mol⁻¹ nm⁻¹입니다. PASS를 위해 기준을 완화하지 마세요. 셀 실행은 보였지만 최종 출력 프레 function parse(){let parts=location.hash.slice(1).split('/');lang=DATA[parts[0]]?parts[0]:'en';route=ROUTES.includes(parts[1])?parts[1]:'intro';if(!DATA[parts[0]]||!ROUTES.includes(parts[1]))history.replaceState(null,'','#'+lang+'/'+route);render();}
function render(){const t=DATA[lang],idx=ROUTES.indexOf(route);document.documentElement.lang=lang;document.title='DFDD · '+t.nav[idx]+' · '+NAMES[lang];document.getElementById('languages').innerHTML=Object.keys(NAMES).map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${NAMES[l]}</button>`).join('');document.getElementById('tabs').innerHTML=ROUTES.map((r,i)=>`<a href="#${lang}/${r}" ${r===route?'aria-current="page"':''}>${i+1} ${esc(t.nav[i])}</a>`).join('');for(let k of ['subtitle','warning','scope','close'])document.getElementById(k).textContent=t[k];document.getElementById('colab').textContent=t.open+' ↗';document.getElementById('search').placeholder=t.search;document.getElementById('search').setAttribute('aria-label',t.search);let q=document.getElementById('search').value.trim().toLowerCase();let sections=t.sections.filter(s=>q?(s.title+' '+s.body+' '+s.cell).toLowerCase().includes(q):GROUPS[route].includes(s.id));document.getElementById('panelTitle').textContent=t.nav[idx];document.getElementById('count').textContent=NAMES[lang]+' · '+(idx+1)+'/'+ROUTES.length;document.getElementById('introfacts').innerHTML=route==='intro'&&!q?`<div class="introbox"><b>${esc(t.title)}</b><p>${esc(t.scope)}</p><div class="chips"><span class="chip">3MXF · chain A</span><span class="chip">JQ1 · pH 7.4</span><span class="chip">25 Å exterior offset</span></div><a class="download" href="https://colab.research.google.com/drive/1Rcf-UDw-a_xf3_KN9dvUlygl-iqkg-kx?usp=sharing" target="_blank" rel="noopener noreferrer">${esc(t.open)} ↗</a><a class="download" href="https://github.com/nyelidl/DFDD_GEN" target="_blank" rel="noopener noreferrer">GitHub repository ↗</a></div><div class="facts"><b>${esc(t.observed)}</b><p>${esc(t.facts)}</p></div>`:'';document.getElementById('chapters').innerHTML=sections.map(s=>`<article id="${s.id}"><div class="cell">${esc(s.cell)}</div><h3>${esc(s.title)}</h3><p class="body">${esc(s.body)}</p>${s.diagram?`<figure class="diagram"><a href="${diagrams[s.diagram]}"><img src="${diagrams[s.diagram]}" alt="DFDD ${esc(s.diagram)} schematic" loading="lazy" onerror="this.hidden=true;this.parentElement.insertAdjacentText('beforeend','Diagram asset is not available in this deployment.')"></a><figcaption class="caption">${esc(t.diagram)} · nyelidl/DFDD_GEN</figcaption></figure>`:''}${s.shots.map(id=>{let c=CAPTURES[id];return `<figure class="shot"><button type="button" data-image="${c.file}" aria-label="${esc(t.screenshot)}"><img src="${c.file}" alt="${esc(s.cell+' — '+s.title)}" loading="lazy" width="1463" height="743" onerror="this.closest('button').hidden=true;this.closest('figure').querySelector('.image-missing').hidden=false"></button><div class="image-missing" hidden><div><strong>Screenshot not available in this deployment</strong><code>${esc(c.file)}</code><div>Place the image beside index.html, preserving its exact filename.</div></div></div><figcaption><span class="status">${esc(c.status)}</span><br>${esc(t.screenshot)}<br>${esc(c.caption)}<br>${esc(c.captured_utc)} · 3MXF / JQ1 · exact hosted hash UNVERIFIED</figcaption></figure>`}).join('')}</article>`).join('') || `<div class="empty-results">No matching steps. Try another search term.</div>`;document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.lang,route)));document.querySelectorAll('[data-image]').forEach(b=>b.addEventListener('click',()=>{let img=document.getElementById('large');img.src=b.dataset.image;img.alt=b.querySelector('img').alt;document.getElementById('lightbox').showModal()}));document.getElementById('prev').textContent=t.prevnext[0];document.getElementById('next').textContent=t.prevnext[1];document.getElementById('pagerProgress').textContent=(idx+1)+' / '+ROUTES.length;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===ROUTES.length-1;document.getElementById('sources').innerHTML=`<b>${esc(t.evidence)}</b><p>Hosted Colab: PARTIAL · Final minimization/export/reload: UNVERIFIED. Screenshots: 28 Oct 2026. Technical translations await expert review.</p><a href="https://github.com/nyelidl/DFDD_GEN#readme">Repository README</a><a href="https://doi.org/10.1021/acs.jcim.5c02852">DFDD paper</a><a href="https://doi.org/10.1021/acs.jcim.7b00674">Related method</a>`;}
window.addEventListener('hashchange',()=>{document.getElementById('search').value='';parse();window.scrollTo({top:0,behavior:'auto'})});document.getElementById('prev').addEventListener('click',()=>go(lang,ROUTES[Math.max(0,ROUTES.indexOf(route)-1)]));document.getElementById('next').addEventListener('click',()=>go(lang,ROUTES[Math.min(ROUTES.length-1,ROUTES.indexOf(route)+1)]));document.getElementById('search').addEventListener('input',render);document.getElementById('close').addEventListener('click',()=>document.getElementById('lightbox').close());parse();
</script></body></html>
